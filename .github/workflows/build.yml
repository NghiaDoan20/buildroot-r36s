name: Build R36S Buildroot OS

on:
  workflow_dispatch:
  push:
    branches: [ main, master, r36s ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev rsync cpio unzip \
            bc file wget git python3 graphviz cvs subversion \
            bzip2 locales
          sudo locale-gen en_US.UTF-8

      - name: Load R36S configuration
        run: make r36s_defconfig
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8

      - name: Compile Buildroot system
        run: make -j$(nproc)
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8

      - name: Upload output firmware image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r36s-buildroot-image
          path: output/images/