name: Build R36S Buildroot OS

on:
  workflow_dispatch: # Allows manually triggering the build from the GitHub UI
  push:
    branches: [ main, master, r36s ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses5-dev rsync cpio unzip \
            bc locale-gen wget git python3 graphviz cvs \
            subversion bzip2

      - name: Load R36S configuration
        run: |
          make r36s_defconfig

      - name: Compile Buildroot system
        run: |
          make -j$(nproc)

      - name: Upload output firmware image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r36s-buildroot-image
          path: output/images/