name: Build R36S Buildroot OS

on:
  workflow_dispatch:
  push:
    branches: [ main, master, r36s ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Expand Swap Space
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev rsync cpio unzip \
            bc file wget git python3 graphviz cvs subversion \
            bzip2 locales mtools dosfstools
          sudo locale-gen en_US.UTF-8

      
      - name: Load R36S configuration
        run: make r36s_defconfig
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8

      - name: Compile Buildroot system
        run: |
          make BR2_JLEVEL=2 2>&1 | tee buildroot.log || {
            echo "::error::Buildroot build failed. Last 150 lines of build.log:"
            tail -n 150 buildroot.log
            exit 1
          }
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8

      - name: Compress Firmware Image
        run: |
          if [ -f output/images/sdcard.img ]; then
            gzip -fk-9 output/images/sdcard.img
          fi

      - name: Upload output firmware image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r36s-buildroot-image
          path: output/images/